<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>API HUB</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#050816;--bg2:#0b1226;--fg:#e8ecf8;--mut:#8d98b8;--ac:#38bdf8;--ac2:#8b5cf6;--glass:rgba(255,255,255,.06);--bd:rgba(255,255,255,.12);box-sizing:border-box;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{--hi:color-mix(in srgb,var(--ac) 60%,#fff)}
html{scroll-padding-top:calc(72px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 "Space Grotesk","Vazirmatn",system-ui,sans-serif;overflow-x:hidden}
[dir=rtl] body{font-family:"Vazirmatn","Space Grotesk",system-ui,sans-serif}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
header{direction:ltr;position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:12px clamp(16px,4vw,48px);background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--bd)}
.logo{font-weight:700;font-size:20px;letter-spacing:.04em;text-decoration:none;display:flex;align-items:center;gap:10px;direction:ltr}
.logo img{height:38px;width:auto;border-radius:10px;display:block}
.mark{width:26px;height:26px;border-radius:8px;background:conic-gradient(from 200deg,var(--ac),var(--ac2),var(--ac));box-shadow:0 0 22px var(--ac);animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
nav{display:flex;gap:4px;align-items:center;margin-right:auto}
nav a,.pill{padding:8px 12px;border-radius:999px;text-decoration:none;color:var(--mut);background:none;border:0}
nav a:hover,.pill:hover{color:var(--fg);background:var(--glass)}
.sw{display:flex;gap:6px}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--bd);padding:0}
.dot[aria-pressed=true]{border-color:var(--fg);box-shadow:0 0 12px currentColor}
.hero{position:relative;min-height:88vh;display:grid;place-items:center;text-align:center;padding:64px 20px;overflow:hidden;background:radial-gradient(60% 50% at 50% 30%,color-mix(in srgb,var(--glow,var(--ac2)) 70%,transparent),transparent),radial-gradient(40% 40% at 80% 70%,color-mix(in srgb,var(--ac) 22%,transparent),transparent)}
canvas{position:absolute;inset:0;width:100%;height:100%}
.hero>div{position:relative;max-width:880px}
h1{font-size:clamp(40px,9vw,104px);line-height:1;margin:0 0 20px;font-weight:700;letter-spacing:-.03em;background:linear-gradient(180deg,#fff,var(--ac) 130%);-webkit-background-clip:text;background-clip:text;color:transparent}
[dir=rtl] h1{letter-spacing:0;line-height:1.3;font-weight:800}
.sub{color:var(--mut);font-size:clamp(16px,2.2vw,20px);max-width:620px;margin:0 auto 28px}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{padding:13px 24px;border-radius:14px;border:1px solid var(--bd);background:var(--glass);text-decoration:none;backdrop-filter:blur(10px);transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px)}
.btn.p{background:linear-gradient(135deg,var(--ac),var(--ac2));border:0;color:var(--on,#fff);font-weight:600;box-shadow:0 8px 32px color-mix(in srgb,var(--ac) 40%,transparent)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:44px auto 0;max-width:760px}
.stat{padding:16px;border:1px solid var(--bd);border-radius:16px;background:var(--glass)}
.stat b{display:block;font-size:28px}
.stat span{color:var(--mut);font-size:13px}
section{padding:72px clamp(16px,4vw,48px);max-width:1240px;margin:auto}
h2{font-size:clamp(28px,4vw,44px);margin:0 0 8px;letter-spacing:-.02em}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0}
input,select{background:var(--glass);border:1px solid var(--bd);color:var(--fg);padding:11px 14px;border-radius:12px;font:inherit}
input{flex:1;min-width:200px}
select option{color:#000}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.chip{padding:7px 14px;border-radius:999px;border:1px solid var(--bd);background:none}
.chip[aria-pressed=true]{background:var(--ac);color:var(--on,#fff);border-color:var(--ac);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px}
.card{position:relative;padding:24px;border-radius:22px;border:1px solid var(--bd);background:linear-gradient(145deg,rgba(255,255,255,.09),rgba(255,255,255,.02));backdrop-filter:blur(14px);transition:transform .15s,border-color .2s;transform-style:preserve-3d;display:flex;flex-direction:column;gap:10px}
.card:hover{border-color:var(--ac)}
.card h3{margin:0;font-size:21px}
.card p{margin:0;color:var(--mut);flex:1}
.cat{color:var(--hi);font-size:13px}
.price{font-size:24px;font-weight:700}
.price small{font-size:13px;color:var(--mut);font-weight:400}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{font-size:12px;padding:3px 10px;border-radius:999px;border:1px dashed var(--mut);color:var(--mut)}
.empty{grid-column:1/-1;text-align:center;padding:48px;border:1px dashed var(--bd);border-radius:20px;color:var(--mut)}
dialog{max-width:640px;width:calc(100% - 32px);background:var(--bg2);color:var(--fg);border:1px solid var(--bd);border-radius:24px;padding:28px}
dialog::backdrop{background:rgba(0,0,0,.65);backdrop-filter:blur(4px)}
pre{direction:ltr;text-align:left;background:#02040c;color:#cde;border:1px solid var(--bd);border-radius:14px;padding:14px;overflow-x:auto;font:13px/1.6 ui-monospace,Menlo,monospace;margin:12px 0}
.toast{position:fixed;inset-inline:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));max-width:420px;margin-inline:auto;padding:14px 18px;border-radius:14px;background:var(--bg2);border:1px solid var(--ac);box-shadow:0 12px 40px #0008;opacity:0;transform:translateY(20px);pointer-events:none;transition:.3s;z-index:50}
.toast.on{opacity:1;transform:none}
details{border:1px solid var(--bd);border-radius:14px;padding:14px 18px;background:var(--glass);margin-bottom:10px}summary{cursor:pointer;font-weight:600}details p{color:var(--mut);margin:10px 0 0}
.fab{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--on,#fff);display:grid;place-items:center;box-shadow:0 8px 28px color-mix(in srgb,var(--ac) 45%,transparent);z-index:30}
.chat{position:fixed;left:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));width:min(370px,calc(100vw - 32px));height:min(540px,70vh);display:flex;flex-direction:column;background:var(--bg2);border:1px solid var(--bd);border-radius:22px;box-shadow:0 20px 60px #000a;z-index:30;overflow:hidden}
.chat[hidden]{display:none}
.ch-h{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bd)}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:92%;padding:10px 13px;border-radius:16px;background:var(--glass);border:1px solid var(--bd)}
.msg.u{align-self:flex-end;background:var(--ac);color:var(--on,#fff);border:0}
.mini{margin-top:8px;padding:10px;border:1px solid var(--bd);border-radius:12px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.mini .sp{direction:ltr;text-align:left;font:12px ui-monospace,Menlo,monospace;color:var(--hi)}
.mini span{color:var(--hi)}
.qc{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 8px}
.ch-f{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--bd)}
.ch-f input{min-width:0}
.ch-f .btn{padding:8px 16px}
footer{padding:40px 20px;text-align:center;color:var(--mut);border-top:1px solid var(--bd)}
[dir=rtl] header nav,[dir=rtl] header .pill{direction:rtl}
@media(max-width:720px){nav a{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>

const $=s=>document.querySelector(s);
const S={lang:"en",theme:"API HUB",cat:"all",q:"",sort:0};
try{const a=JSON.parse(localStorage.getItem("apihub")||"{}");if(T[a.lang])S.lang=a.lang;if(THEMES[a.theme])S.theme=a.theme}catch(e){}
const save=()=>{try{localStorage.setItem("apihub",JSON.stringify({lang:S.lang,theme:S.theme}))}catch(e){}};
const L=()=>T[S.lang];
const num=n=>n.toLocaleString(S.lang==="fa"?"fa-IR":"en-US");
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),3600)};
function applyTheme(){const v=THEMES[S.theme],r=document.documentElement.style;["--bg","--bg2","--ac","--ac2","--fg","--mut"].forEach((k,i)=>r.setProperty(k,v[i]));r.setProperty("--glow",v[6]||v[3]);{const h=v[2].slice(1),Lm=(parseInt(h.slice(0,2),16)*299+parseInt(h.slice(2,4),16)*587+parseInt(h.slice(4,6),16)*114)/1000;r.setProperty("--on",Lm>150?"#04101c":"#fff")}const light=S.theme==="Light Luxury";r.setProperty("--glass",light?"rgba(0,0,0,.04)":"rgba(255,255,255,.06)");r.setProperty("--bd",light?"rgba(0,0,0,.14)":"rgba(255,255,255,.12)");r.colorScheme=light?"light":"dark";

 $("#chips").innerHTML=["all",...CATS].map(c=>`<button class="chip" data-c="${c}" aria-pressed="${c===S.cat}">${c==="all"?l.all:l.cat[c]}</button>`).join("");
 $("#stats").innerHTML=[num(P.length),"—","—","—"].map((v,i)=>`<div class="stat"><b>${v}</b><span>${l.stats[i]}${i?` · ${l.pend}`:""}</span></div>`).join("");
 $("#stlist").innerHTML=l.stl.map(([a,b])=>`<div class="card"><h3>${a}</h3><span class="badge">${b}</span></div>`).join("");
 $("#trlist").innerHTML=l.tl.map(([a,b])=>`<div class="card"><h3>${a}</h3><p>${b}</p></div>`).join("");
 $("#steps").innerHTML=l.steps.map(([a,b],i)=>`<div class="card"><span class="cat">${num(i+1)}</span><h3>${a}</h3><p>${b}</p></div>`).join("");

 $("#by").textContent=l.by;
 $("#cin").placeholder=l.ch_ph;$("#qchips").innerHTML=l.qc.map(q=>`<button class="chip" data-q="${q}">${q}</button>`).join("");cartCount();
 grid();document.title="API HUB"}
function grid(){const l=L();let r=P.filter(p=>(S.cat==="all"||p.c===S.cat)&&(p.n[S.lang]+p.n.en+p.d[S.lang]).toLowerCase().includes(S.q.toLowerCase()));
 r=r.slice();if(S.sort===1)r.sort((a,b)=>a.p-b.p);if(S.sort===2)r.sort((a,b)=>b.p-a.p);if(S.sort===3)r.sort((a,b)=>a.n.en.localeCompare(b.n.en));
 $("#grid").innerHTML=r.length?r.map(p=>`<article class="card"><span class="cat">${l.cat[p.c]}</span><h3>${p.n[S.lang]}</h3><p>${p.d[S.lang]}</p><div class="price">${num(p.p)} <small>${S.lang==="fa"?"تومان":"Toman"} ${l.free}</small></div><div class="row"><span class="badge">${l.noRate}</span><span class="badge">${p.m}</span></div><div class="row"><button class="btn p" data-d="${p.id}">${l.details}</button><button class="btn" data-add="${p.id}">${l.add}</button></div></article>`).join(""):`<div class="empty">${l.none}</div>`}
function curl(p){return`curl -X ${p.m} "https://api.example.com${p.e}" \\\n  -H "X-API-Key: YOUR_API_KEY"`+(p.b?` \\\n  -H "Content-Type: application/json" \\\n  -d '${p.b}'`:"")}
function open(html){$("#dbody").innerHTML=html;$("#dlg").showModal()}
function detail(id){const p=P.find(x=>x.id===id),l=L(),c=curl(p);
 open(`<h2>${p.n[S.lang]}</h2><p>${p.d[S.lang]}</p><p><b>${l.ep}:</b> <code dir="ltr">${p.m} ${p.e.split("?")[0]}</code></p><p>${l.auth}</p><b>${l.ex}</b><pre id="code"></pre><button class="btn" id="cp">${l.copy}</button>`);
 $("#code").textContent=c;$("#cp").onclick=async()=>{try{await navigator.clipboard.writeText(c);toast(l.copied)}catch(e){toast(c)}}}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;
 if(t.dataset.t){S.theme=t.dataset.t;save();applyTheme()}
 else if(t.dataset.c){S.cat=t.dataset.c;render()}
 else if(t.dataset.d)detail(t.dataset.d);
 else if(t.dataset.add)addCart(t.dataset.add);
 else if(t.dataset.rm){cart=cart.filter(i=>i!==t.dataset.rm);saveCart();cartView()}
 else if(t.dataset.q)ask(t.dataset.q);
 else if(t.id==="fab"||t.id==="chx")chatToggle(t.id==="fab"?undefined:false);
 else if(t.id==="send"){ask($("#cin").value);$("#cin").value=""}

 else if(t.id==="close")$("#dlg").close()});

$("#grid").addEventListener("pointermove",e=>{if(matchMedia("(prefers-reduced-motion:reduce)").matches||e.pointerType!=="mouse")return;const c=e.target.closest(".card");if(!c)return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform=`perspective(700px) rotateY(${x*8}deg) rotateX(${-y*8}deg)`});

// Network canvas
(function(){const cv=$("#net"),x=cv.getContext("2d"),rm=matchMedia("(prefers-reduced-motion:reduce)").matches;let w,h,N=[],mx=-1e4,my=-1e4;
 function size(){const d=Math.min(devicePixelRatio||1,2);w=cv.clientWidth;h=cv.clientHeight;cv.width=w*d;cv.height=h*d;x.setTransform(d,0,0,d,0,0);
  N=Array.from({length:Math.min(140,Math.round(w*h/6800))},()=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,r:.8+Math.random()*.9}))}
 function draw(){x.clearRect(0,0,w,h);const ac=getComputedStyle(document.documentElement).getPropertyValue("--hi").trim()||"#ff6b73";
  for(const a of N){if(!rm){a.x=(a.x+a.vx+w)%w;a.y=(a.y+a.vy+h)%h}
   const d=Math.hypot(mx-a.x,my-a.y);if(d<170){const k=.018*(1-d/170);a.x+=(mx-a.x)*k;a.y+=(my-a.y)*k}a.cnt=0}
  x.strokeStyle=ac;x.lineWidth=1;
  for(let i=0;i<N.length;i++){const a=N[i];for(let j=i+1;j<N.length&&a.cnt<3;j++){const b=N[j];if(b.cnt>=3)continue;const d=Math.hypot(a.x-b.x,a.y-b.y);if(d<105){x.globalAlpha=(1-d/105)*.35;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke();a.cnt++;b.cnt++}}}
  let m=0;for(const a of N){const d=Math.hypot(mx-a.x,my-a.y);if(d<150&&m<5){m++;x.globalAlpha=(1-d/150)*.7;x.beginPath();x.moveTo(mx,my);x.lineTo(a.x,a.y);x.stroke()}}
  x.fillStyle=ac;x.globalAlpha=.85;for(const a of N){x.beginPath();x.arc(a.x,a.y,a.r,0,7);x.fill()}
  if(!rm)requestAnimationFrame(draw)}
 addEventListener("pointermove",e=>{const r=cv.getBoundingClientRect();mx=e.clientX-r.left;my=e.clientY-r.top});
 document.addEventListener("pointerleave",()=>{mx=-1e4;my=-1e4});
 addEventListener("resize",()=>{size();if(rm)draw()});size();draw()})();
let cart=[];try{cart=JSON.parse(localStorage.getItem("apihub-cart")||"[]").filter(id=>P.some(p=>p.id===id))}catch(e){}
function cartCount(){$("#cartn").textContent=num(cart.length)}
function saveCart(){try{localStorage.setItem("apihub-cart",JSON.stringify(cart))}catch(e){}cartCount()}
const pr=p=>num(p.p)+" "+(S.lang==="fa"?"تومان":"Toman");
function addCart(id){const l=L();if(cart.includes(id))return toast(l.inCart);cart.push(id);saveCart();toast(l.added)}
function cartView(){const l=L(),it=cart.map(id=>P.find(p=>p.id===id));
 open(`<h2>${l.cart}</h2>`+(it.length?it.map(p=>`<div class="row" style="justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--bd)"><span>${p.n[S.lang]}<br><small>${pr(p)}</small></span><button class="btn" data-rm="${p.id}">${l.rm}</button></div>`).join("")+`<p><b>${l.total}: ${pr({p:it.reduce((a,p)=>a+p.p,0)})}</b></p><button class="btn p" id="checkout">${l.checkout}</button>`:`<p class="sub" style="margin:16px 0">${l.cart_e}</p>`))}
function say(c,who,html){const m=document.createElement("div");m.className="msg "+who;if(html)m.innerHTML=c;else m.textContent=c;$("#msgs").appendChild(m);$("#msgs").scrollTop=1e9}

function ask(q){q=q.trim();if(!q)return;say(q,"u");const l=L(),s=q.toLowerCase().replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)),has=a=>a.some(k=>s.includes(k));
 const K={"web-data":["web","وب"],"ai-text":["text","متن","هوش"],"data":["data","داده"],"utility":["util","ابزار"],"vision":["vision","تصویر","بینایی","image"],"security":["secur","امنیت"]};
 let ids=P.filter(p=>has(K[p.id]||[])).map(p=>p.id);if(ids.includes("web-data"))ids=ids.filter(i=>i!=="data");
 const m=s.replace(/,|٬/g,"").match(/\d+/);let t,list=[];
 if(has(["cart","سبد"])){t=l.cartOpen;setTimeout(cartView,300)}
 else if(ids.length){t=l.found;list=ids}
 else if(m){let n=+m[0];if(n<10000)n*=1000;list=P.filter(p=>p.p<=n).sort((a,b)=>a.p-b.p).map(p=>p.id);t=list.length?l.budget(num(n)):l.none;if(!list.length)list=[...P].sort((a,b)=>a.p-b.p).slice(0,2).map(p=>p.id)}
 else if(has(["cheap","ارزان","قیمت کم","کمترین","lowest"])){t=l.cheap;list=[...P].sort((a,b)=>a.p-b.p).slice(0,2).map(p=>p.id)}
 else if(has(["all","list","همه","لیست"])){t=l.all;list=P.map(p=>p.id)}
 else t=l.fb;
 say(t+list.map(i=>mini(P.find(p=>p.id===i))).join(""),"b",1)}
